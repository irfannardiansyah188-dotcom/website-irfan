<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill Quest - Irfan Ardiansyah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentGreen: '#10b981',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- Tombol Kembali -->
        <div>
            <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-accentGreen transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Kembali ke Portfolio
            </a>
        </div>

        <!-- Header Quest -->
        <div class="bg-cardBg border border-slate-700 rounded-2xl p-6 shadow-xl space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-accentGreen px-2.5 py-1 rounded border border-accentGreen/20">Active Quest</span>
                <span class="text-xs text-amber-400"><i class="fa-solid fa-coins mr-1"></i> Gold Calculator</span>
            </div>
            <h1 class="text-2xl font-extrabold">Split Bill & Kalkulator Patungan</h1>
            <p class="text-slate-400 text-sm">Hitung total pengeluaran makan atau belanja bareng teman secara adil, lengkap dengan pajak dan tips.</p>
        </div>

        <!-- Form Kalkulator -->
        <div class="bg-cardBg border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Total Tagihan (Rp)</label>
                <input type="number" id="totalBill" placeholder="Contoh: 150000" class="w-full bg-darkBg border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-accentGreen">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Pajak / Layanan (%)</label>
                    <input type="number" id="taxPercent" value="10" class="w-full bg-darkBg border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-accentGreen">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Jumlah Orang</label>
                    <input type="number" id="totalPeople" value="3" class="w-full bg-darkBg border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-accentGreen">
                </div>
            </div>

            <button onclick="calculateBill()" class="w-full bg-accentGreen hover:bg-emerald-600 text-darkBg font-bold py-3 rounded-xl transition shadow-lg mt-2">
                Hitung Patungan <i class="fa-solid fa-calculator ml-1"></i>
            </button>
        </div>

        <!-- Hasil Perhitungan -->
        <div id="resultCard" class="bg-cardBg border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4 hidden">
            <h2 class="text-lg font-bold border-l-4 border-accentGreen pl-3">Hasil Pembagian Quest</h2>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between text-slate-400">
                    <span>Subtotal Tagihan:</span>
                    <span id="resSubtotal" class="text-slate-100 font-medium">Rp 0</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Nominal Pajak:</span>
                    <span id="resTax" class="text-slate-100 font-medium">Rp 0</span>
                </div>
                <hr class="border-slate-700 my-2">
                <div class="flex justify-between items-center bg-darkBg/60 p-4 rounded-xl border border-slate-700/50">
                    <span class="font-bold text-slate-200">Per Orang Harus Bayar:</span>
                    <span id="resPerPerson" class="text-xl font-extrabold text-accentGreen">Rp 0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateBill() {
            let bill = parseFloat(document.getElementById('totalBill').value) || 0;
            let taxRate = parseFloat(document.getElementById('taxPercent').value) || 0;
            let people = parseInt(document.getElementById('totalPeople').value) || 1;

            if (bill <= 0 || people <= 0) {
                alert("Masukkan total tagihan dan jumlah orang yang valid!");
                return;
            }

            let taxAmount = bill * (taxRate / 100);
            let finalTotal = bill + taxAmount;
            let perPerson = finalTotal / people;

            document.getElementById('resSubtotal').innerText = 'Rp ' + bill.toLocaleString('id-ID');
            document.getElementById('resTax').innerText = 'Rp ' + taxAmount.toLocaleString('id-ID', {maximumFractionDigits: 0});
            document.getElementById('resPerPerson').innerText = 'Rp ' + perPerson.toLocaleString('id-ID', {maximumFractionDigits: 0});

            document.getElementById('resultCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
