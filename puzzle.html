<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Photo Puzzle - Irfan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #f39c12;
            text-shadow: 2px 2px #000;
        }
        #puzzle-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 2px;
            width: 304px;
            height: 304px;
            margin: 20px auto;
            border: 4px solid #f39c12;
            background: #333;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .puzzle-piece {
            width: 100px;
            height: 100px;
            background-image: url('irfan-puzzle.jpg');
            background-size: 300px 300px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.1s;
        }
        .puzzle-piece:active {
            transform: scale(0.95);
        }
        .info {
            margin-top: 15px;
            font-size: 16px;
            color: #ddd;
        }
        .btn-group {
            margin-top: 15px;
        }
        button, .back-link {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px #d35400;
        }
        button:hover, .back-link:hover {
            background-color: #d35400;
        }
        button:active, .back-link:active {
            box-shadow: 0 2px #d35400;
            transform: translateY(2px);
        }
        .back-link {
            background-color: #34495e;
            box-shadow: 0 4px #2c3e50;
        }
        .back-link:hover {
            background-color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>RPG Photo Puzzle Quest</h1>
    <p class="info">Susun kembali potongan foto Irfan dengan mengklik kotaknya!</p>

    <div id="puzzle-container"></div>
    
    <div class="btn-group">
        <button onclick="acakPuzzle()">Acak Puzzle</button>
        <a href="index.html" class="back-link">Kembali ke Portofolio</a>
    </div>

    <script>
        const container = document.getElementById('puzzle-container');
        const ukuranGrid = 3;
        let posisiAwal = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let posisiSekarang = [...posisiAwal];

        function buatPuzzle() {
            container.innerHTML = '';
            posisiSekarang.forEach((indexAsli, indexSekarang) => {
                const piece = document.createElement('div');
                piece.classList.add('puzzle-piece');
                
                const x = (indexAsli % ukuranGrid) * 100;
                const y = Math.floor(indexAsli / ukuranGrid) * 100;
                piece.style.backgroundPosition = `-${x}px -${y}px`;
                
                piece.addEventListener('click', () => {
                    tukarPosisi(indexSekarang);
                });

                container.appendChild(piece);
            });
        }

        let indeksTerpilih = null;
        function tukarPosisi(index) {
            if (indeksTerpilih === null) {
                indeksTerpilih = index;
                container.children[index].style.border = '2px solid #00ffcc';
            } else {
                let temp = posisiSekarang[indeksTerpilih];
                posisiSekarang[indeksTerpilih] = posisiSekarang[index];
                posisiSekarang[index] = temp;
                
                indeksTerpilih = null;
                buatPuzzle();
                cekMenang();
            }
        }

        function acakPuzzle() {
            for (let i = posisiSekarang.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [posisiSekarang[i], posisiSekarang[j]] = [posisiSekarang[j], posisiSekarang[i]];
            }
            buatPuzzle();
        }

        function cekMenang() {
            const menang = posisiSekarang.every((val, i) => val === posisiAwal[i]);
            if (menang) {
                setTimeout(() => {
                    alert("🎉 Selamat! Kamu berhasil menyelesaikan Puzzle RPG Irfan!");
                }, 200);
            }
        }

        acakPuzzle();
    </script>

</body>
</html>
